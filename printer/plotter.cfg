# plotter.cfg - Qidi Q2 pen-plotter helpers. Add to printer.cfg:   [include plotter.cfg]
# Pen offsets are applied by the G-code generator, so these macros only handle safety, speeds, bed mesh and calibration.
#
# Workflow every time:
#   1. Pen cartridge REMOVED.  Paste the PLOT_MESH line from the converter page into the console (probes the paper area, saves profile "plot" in memory).
#   2. Fit the pen cartridge.
#   3. Start the plot G-code file. PLOT_START loads the "plot" mesh.

[gcode_macro PLOT_VARS]
variable_z_draw: 0.0             ; informational only (z_draw is written into the G-code by the converter)
variable_accel: 2000
variable_corner: 5.0
variable_use_mesh: 1             ; 1 = follow the "plot" bed mesh while drawing, 0 = flat Z
variable_mesh_profile: "plot"    ; profile name created by PLOT_MESH
variable_do_tilt: 1              ; 1 = run Z_TILT_ADJUST before meshing
variable_park_x: 85              ; idle park = Qidi's default purge/trash position (MOVE_TO_TRASH: X85, Y287.5, rear chute)
variable_park_y: 287.5
variable_park_z: 13.8            ; never lowers: if the toolhead is already higher it stays there
variable_plotting: 0             ; set to 1 by PLOT_START, back to 0 by PLOT_END (the cancel macro reads it)
gcode:
  RESPOND PREFIX="plotter" MSG="mesh={printer['gcode_macro PLOT_VARS'].use_mesh} profile={printer['gcode_macro PLOT_VARS'].mesh_profile} accel={printer['gcode_macro PLOT_VARS'].accel}"

# Phase 1: probe a mesh over the drawing area. Run with the pen cartridge REMOVED (the probe is at the nozzle; the pen would hit the bed first).
# Defaults cover an A4 sheet lined up with the rear-left corner minus a 10 mm margin. The converter page prints a PLOT_MESH line with exact bounds for your drawing.
# Bounds are NOZZLE positions (the pen is 26.45 mm in front of the nozzle).
[gcode_macro PLOT_MESH]
description: Probe a bed mesh over the drawing area. Run with the pen cartridge REMOVED.
gcode:
  {% set v = printer['gcode_macro PLOT_VARS'] %}
  {% set x0 = [params.MIN_X|default(10)|float, 10]|max %}
  {% set y0 = [params.MIN_Y|default(36)|float, 10]|max %}
  {% set x1 = [params.MAX_X|default(200)|float, 260]|min %}
  {% set y1 = [params.MAX_Y|default(260)|float, 260]|min %}
  {% set cx = params.COUNT_X|default(5)|int %}
  {% set cy = params.COUNT_Y|default(6)|int %}
  RESPOND PREFIX="plotter" MSG="PLOT_MESH: pen cartridge must be REMOVED. Meshing nozzle X{x0}..{x1} Y{y0}..{y1}, {cx}x{cy} points."
  {% if printer.toolhead.homed_axes != "xyz" %}
    G28
  {% endif %}
  {% if v.do_tilt|int == 1 %}
    Z_TILT_ADJUST
  {% endif %}
  BED_MESH_CLEAR
  SET_GCODE_OFFSET Z=0 MOVE=0
  G90
  G1 Z10 F600
  {% if 'gcode_macro bed_mesh_calibrate' in printer.configfile.settings %}
    ; the KAMP macro replaces BED_MESH_CALIBRATE and ignores custom bounds, so call the original directly
    _BED_MESH_CALIBRATE MESH_MIN={x0},{y0} MESH_MAX={x1},{y1} PROBE_COUNT={cx},{cy} ALGORITHM=lagrange PROFILE={v.mesh_profile}
  {% else %}
    BED_MESH_CALIBRATE MESH_MIN={x0},{y0} MESH_MAX={x1},{y1} PROBE_COUNT={cx},{cy} ALGORITHM=lagrange PROFILE={v.mesh_profile}
  {% endif %}
  PLOT_PARK
  RESPOND PREFIX="plotter" MSG="mesh done (kept in memory, not saved). Now fit the pen cartridge, then run PEN_TOUCH or start the plot."

# Phase 2: the plot.
[gcode_macro PLOT_START]
gcode:
  {% set v = printer['gcode_macro PLOT_VARS'] %}
  {% if printer.toolhead.homed_axes != "xyz" %}
    {action_raise_error("PLOT_START: home first. Home with the pen cartridge REMOVED, then fit it (the pen sticks out below the nozzle).")}
  {% endif %}
  {% if v.use_mesh|int == 1 and v.mesh_profile not in printer.bed_mesh.profiles %}
    {action_raise_error("PLOT_START: no bed mesh profile named '" ~ v.mesh_profile ~ "'. Run PLOT_MESH first (pen cartridge removed), or set use_mesh to 0 in PLOT_VARS.")}
  {% endif %}
  SAVE_GCODE_STATE NAME=PLOT
  SET_GCODE_VARIABLE MACRO=PLOT_VARS VARIABLE=plotting VALUE=1
  SET_GCODE_OFFSET Z=0 MOVE=0         ; a leftover print Z offset would shift z_draw
  M104 S0                             ; hotend off - nothing to extrude
  M140 S0
  {% if v.use_mesh|int == 1 %}
    BED_MESH_PROFILE LOAD={v.mesh_profile}   ; follow the paper mesh
  {% else %}
    BED_MESH_CLEAR
  {% endif %}
  SET_VELOCITY_LIMIT ACCEL={v.accel} SQUARE_CORNER_VELOCITY={v.corner}
  G90
  # leave the purge bin with the bed LOW: the first Z move in the G-code lowers the toolhead to pen height, and from the park spot
  # (X85, Y287.5) that would drive the pen cartridge into the chute. Go up to park height, then come forward clear of the rear wall;
  # only then does the G-code drop to travel height.
  G1 Z{[printer.toolhead.position.z + 3, v.park_z]|max} F1200
  {% if printer.toolhead.position.y > 260 %}
    G1 Y260 F3000
  {% endif %}

[gcode_macro PLOT_PARK]
description: Move to the idle park position (also run it by hand any time, e.g. before taking the bed photo)
gcode:
  {% set v = printer['gcode_macro PLOT_VARS'] %}
  G90
  G1 Z{[printer.toolhead.position.z, v.park_z]|max} F1200
  # same approach as Qidi's MOVE_TO_TRASH: stay in front of the rear wall until over the chute, then creep in
  {% if printer.toolhead.position.y < 260 %}
    G1 Y260 F6000
  {% endif %}
  G1 X{v.park_x} F6000
  G1 Y{v.park_y} F3000

[gcode_macro PLOT_END]
gcode:
  G91
  G1 Z5 F1200
  G90
  RESTORE_GCODE_STATE NAME=PLOT
  SET_VELOCITY_LIMIT ACCEL={printer.configfile.settings.printer.max_accel} SQUARE_CORNER_VELOCITY={printer.configfile.settings.printer.square_corner_velocity}
  PLOT_PARK
  SET_GCODE_VARIABLE MACRO=PLOT_VARS VARIABLE=plotting VALUE=0
  RESPOND PREFIX="plotter" MSG="plot finished - remove the pen cartridge before homing/printing"

# Find z_draw (with the plot mesh loaded): moves to the middle of the bed 20 mm up, then to Z12; jog Z down slowly (G91 / G1 Z-0.5 F300 ...)
# until the pen tip touches the paper, then run GET_POSITION and use the Z value as z_draw.
[gcode_macro PEN_TOUCH]
gcode:
  {% set v = printer['gcode_macro PLOT_VARS'] %}
  {% if printer.toolhead.homed_axes != "xyz" %}
    {action_raise_error("Home first")}
  {% endif %}
  SET_GCODE_OFFSET Z=0 MOVE=0
  {% if v.use_mesh|int == 1 %}
    {% if v.mesh_profile not in printer.bed_mesh.profiles %}
      {action_raise_error("No bed mesh profile named '" ~ v.mesh_profile ~ "'. Run PLOT_MESH first with the pen removed.")}
    {% endif %}
    BED_MESH_PROFILE LOAD={v.mesh_profile}
  {% else %}
    BED_MESH_CLEAR
  {% endif %}
  G90
  G1 Z20 F1200
  G1 X132 Y150 F6000
  G1 Z12 F600
  RESPOND PREFIX="plotter" MSG="Jog down in 0.5/0.1 mm steps (G91 then G1 Z-0.5 F300) until the pen tip just touches the paper, then run GET_POSITION and note Z = your z_draw value"
