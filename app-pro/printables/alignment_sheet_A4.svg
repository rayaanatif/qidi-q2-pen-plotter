<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297"><rect width="210" height="297" fill="#fff" stroke="none"/><g fill="none" stroke="#000" stroke-width="0.5" stroke-linecap="round"><circle cx="14.00" cy="14.00" r="4"/><path d="M7.50 14.00H20.50M14.00 7.50V20.50"/><circle cx="196.00" cy="14.00" r="4"/><path d="M189.50 14.00H202.50M196.00 7.50V20.50"/><circle cx="196.00" cy="283.00" r="4"/><path d="M189.50 283.00H202.50M196.00 276.50V289.50"/><circle cx="14.00" cy="283.00" r="4"/><path d="M7.50 283.00H20.50M14.00 276.50V289.50"/><circle cx="64.96" cy="170.02" r="4"/><path d="M58.46 170.02H71.46M64.96 163.52V176.52"/><circle cx="145.04" cy="94.70" r="4"/><path d="M138.54 94.70H151.54M145.04 88.20V101.20"/></g><text x="105.00" y="16.00" font-size="4" text-anchor="middle" fill="#555" stroke="none" font-family="Arial,Helvetica,sans-serif">REAR (back of the printer)</text><text x="105.00" y="121.68" font-size="4.2" text-anchor="middle" fill="#555" stroke="none" font-family="Arial,Helvetica,sans-serif">Q2 pen plotter alignment sheet</text><text x="105.00" y="128.68" font-size="3.4" text-anchor="middle" fill="#555" stroke="none" font-family="Arial,Helvetica,sans-serif">Print at 100% (actual size, no fit to page).</text><text x="105.00" y="134.68" font-size="3.4" text-anchor="middle" fill="#555" stroke="none" font-family="Arial,Helvetica,sans-serif">Printer REAR at the top; rear-left corner at X 0, Y 270. Tape it flat.</text><text x="105.00" y="140.68" font-size="3.4" text-anchor="middle" fill="#555" stroke="none" font-family="Arial,Helvetica,sans-serif">Then take the bed photo: the app aligns itself from the six rings.</text><text x="105.00" y="146.68" font-size="3.4" text-anchor="middle" fill="#555" stroke="none" font-family="Arial,Helvetica,sans-serif">Sheet 210 x 297 mm, rings 14 mm in from the edges.</text></svg>